[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aqmp-sdk"
version = "2.0.0"
description = "Adaptive Quantum Migration Protocol (AQMP v2.0) SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "cryptography>=41.0",
    "pycryptodome>=3.19",
]

[project.optional-dependencies]
pqc = ["pqcrypto>=0.3.4"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = [
    "sdk/aqmp-sdk-complete",
    "sdk/aqmp-sdk-complete/aqmp_sdk",
]
testpaths = [
    "sdk/aqmp-sdk-complete/aqmp_sdk/tests",
]
addopts = "-ra"
